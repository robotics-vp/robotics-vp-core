model:
  hidden_dim: 96
  head_hidden_dim: 64
  vision_dim: 16
  use_condition_film: true
  use_condition_vector_for_policy: true
  condition_fusion_mode: film
  default_skill_mode: efficiency_throughput
  enable_value_head: true
training:
  seed: 42
  device: cpu
  batch_size: 4
  epochs: 6
  lr: 0.001
  weight_decay: 0.0
  val_fraction: 0.25
  grad_clip: 1.0
  amp: false
  activation_checkpointing: false
