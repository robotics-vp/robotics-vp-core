model:
  hidden_dim: 256
  head_hidden_dim: 128
  vision_dim: 32
  use_condition_film: true
  use_condition_vector_for_policy: true
  condition_fusion_mode: concat
  default_skill_mode: efficiency_throughput
  enable_value_head: true
training:
  seed: 42
  device: cuda
  batch_size: 128
  epochs: 40
  lr: 0.0003
  weight_decay: 0.0001
  val_fraction: 0.2
  grad_clip: 1.0
  amp: true
  activation_checkpointing: true
