[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-vp-economics-model"
version = "0.0.0"
description = "Economics-first robotics stack"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pyyaml",
  "matplotlib",
  "torch",
  "scikit-learn",
  "pydantic>=2",
  "pyarrow>=21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
extend-exclude = [
  "build",
  "dist",
  "*.egg-info",
]

[tool.ruff.lint]
# Keep the rule set used by the quality ratchet explicit. Ruff 0.16 expanded
# its defaults; adopting additional rules requires a separate baseline review.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"experiments/*.py" = ["E402"]
"experiments/**/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
