[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-vp-economics-model"
version = "0.0.0"
description = "Economics-first robotics stack"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pyyaml",
  "matplotlib",
  "torch",
  "scikit-learn",
  "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
